<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KTV Pro - Realtime Low Latency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* UI 保持一致的高级感 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#08080e;--s1:#0e0e18;--s2:#151522;--s3:#1c1c2e;--accent:#00ffc8;--accent-dim:#00ffc828;--accent-glow:#00ffc850;--amber:#ffb020;--text:#e8e8f0;--muted:#5a5a72;--ring:#252538}html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow-x:hidden}body{display:flex;flex-direction:column;align-items:center;padding:16px 14px 32px}.app{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}.header{text-align:center}.header h1{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted)}.viz-wrap{width:100%;aspect-ratio:2.2/1;border-radius:14px;background:var(--s1);border:1px solid var(--ring);overflow:hidden}canvas{width:100%;height:100%}.level-row{width:100%;display:flex;align-items:center;gap:10px}.level-track{flex:1;height:5px;background:var(--s2);border-radius:3px;overflow:hidden}.level-fill{height:100%;width:0%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow);transition:width .05s linear}.level-db{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);width:50px;text-align:right}.power-btn{width:80px;height:80px;border-radius:50%;border:2px solid var(--ring);background:var(--s1);cursor:pointer;margin:0 auto;display:flex;align-items:center;justify-content:center;transition:0.3s}.power-btn.on{border-color:var(--accent);box-shadow:0 0 30px var(--accent-dim)}.panel{width:100%;background:var(--s1);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}.panel-title{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.1em}.slider-row{display:flex;align-items:center;gap:10px}input[type=range]{flex:1;height:3px;background:var(--s3);-webkit-appearance:none;outline:none}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent)}.dev-sel{width:100%;background:var(--s2);border:1px solid var(--ring);color:var(--text);padding:8px;border-radius:6px;font-size:11px}.info-bar{width:100%;display:flex;justify-content:space-between;padding:0 10px}.info-item{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted)}span.val{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>KTV MIC PRO</h1></div>
  <div class="viz-wrap"><canvas id="viz"></canvas></div>
  <div class="level-row">
    <div class="level-track"><div class="level-fill" id="lvlFill"></div></div>
    <span class="level-db" id="lvlDb">-∞ dB</span>
  </div>

  <button class="power-btn" id="pwrBtn">
    <svg id="micIco" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v11m-7-5a7 7 0 0 0 14 0"/></svg>
  </button>

  <div class="panel">
    <span class="panel-title">主音量 / VOLUME</span>
    <div class="slider-row">
      <input type="range" id="volSlider" min="0" max="200" value="100">
      <span style="font-size:10px; width:30px" id="volVal">100</span>
    </div>
    
    <span class="panel-title">混响深度 / REVERB (KTV MODE)</span>
    <div class="slider-row">
      <input type="range" id="revSlider" min="0" max="60" value="25">
      <span style="font-size:10px; width:30px" id="revVal">25</span>
    </div>
  </div>

  <div class="panel">
    <select class="dev-sel" id="inSel"></select>
  </div>

  <div class="info-bar">
    <div class="info-item">实时延迟: <span class="val" id="latVal">0.00</span> ms</div>
    <div class="info-item">采样率: <span class="val" id="srVal">--</span></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let actx, stream, src, gain, delay, feedback, fbGain, compressor, analyser, isActive = false, animId;

async function start() {
    try {
        const constraints = { audio: { deviceId: $("inSel").value ? {exact: $("inSel").value} : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        
        actx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 0 });
        src = actx.createMediaStreamSource(stream);

        // 1. 基础处理：压缩器防止爆音
        compressor = actx.createDynamicsCompressor();
        
        // 2. 音量控制
        gain = actx.createGain();
        
        // 3. KTV 回声电路 (Delay + Feedback Loop)
        delay = actx.createDelay();
        delay.delayTime.value = 0.15; // 150ms 的回声延迟，KTV标准
        fbGain = actx.createGain();   // 反馈增益（决定回声多少次）
        
        analyser = actx.createAnalyser();
        analyser.fftSize = 256;

        // 链路连接：
        // (1) 直通干声：Src -> Compressor -> Gain -> Analyser -> Dest
        src.connect(compressor);
        compressor.connect(gain);
        gain.connect(analyser);
        analyser.connect(actx.destination);

        // (2) 湿声回路：Gain -> Delay -> FeedbackGain -> Delay (循环) -> Analyser
        gain.connect(delay);
        delay.connect(fbGain);
        fbGain.connect(delay); // 闭环形成重复回声
        fbGain.connect(analyser); // 将回声送往输出

        updateParams();
        isActive = true;
        $("pwrBtn").classList.add("on");
        $("srVal").textContent = actx.sampleRate + "Hz";
        render();
    } catch(e) { alert(e); }
}

function updateParams() {
    if (!actx) return;
    // 更新音量 (x2.5 补偿)
    gain.gain.setTargetAtTime(($("volSlider").value/100) * 2.5, actx.currentTime, 0.02);
    // 更新混响深度 (反馈量)
    const revLevel = $("revSlider").value / 100; // 0.0 - 0.6
    fbGain.gain.setTargetAtTime(revLevel, actx.currentTime, 0.02);
}

function render() {
    if (!isActive) return;

    // 计算实时延迟 (ms)
    // baseLatency (硬件缓冲) + outputLatency (系统调度)
    const lat = (actx.baseLatency || 0) + (actx.outputLatency || 0);
    $("latVal").textContent = (lat * 1000).toFixed(2);

    // 绘制频谱
    const canvas = $("viz"), ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    ctx.fillStyle = "#00ffc8";
    const barW = w / data.length;
    for(let i=0; i<data.length; i++) {
        const val = data[i]/255 * h;
        ctx.fillRect(i*barW, h-val, barW-1, val);
    }

    // 更新电平条
    const td = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(td);
    let sum = 0;
    for(let i=0; i<td.length; i++) { let v = (td[i]-128)/128; sum += v*v; }
    const rms = Math.sqrt(sum/td.length);
    $("lvlFill").style.width = Math.min(100, rms*400) + "%";
    $("lvlDb").textContent = rms > 0.001 ? (20*Math.log10(rms)).toFixed(1) + " dB" : "-∞ dB";

    animId = requestAnimationFrame(render);
}

async function stop() {
    isActive = false;
    cancelAnimationFrame(animId);
    if(stream) stream.getTracks().forEach(t => t.stop());
    if(actx) await actx.close();
    $("pwrBtn").classList.remove("on");
    $("latVal").textContent = "0.00";
}

$("pwrBtn").onclick = () => isActive ? stop() : start();
$("volSlider").oninput = () => { $("volVal").textContent = $("volSlider").value; updateParams(); };
$("revSlider").oninput = () => { $("revVal").textContent = $("revSlider").value; updateParams(); };

// 初始化设备列表
navigator.mediaDevices.enumerateDevices().then(devs => {
    $("inSel").innerHTML = devs.filter(d => d.kind === 'audioinput').map(d => `<option value="${d.deviceId}">${d.label||'Mic'}</option>`).join('');
});
</script>
</body>
</html>
